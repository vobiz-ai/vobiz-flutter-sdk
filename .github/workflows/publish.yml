name: Publish to pub.dev

# Runs when a version tag such as v0.2.0 is pushed. pub.dev must trust this
# repository first: on pub.dev, package vobiz_webrtc > Admin > Automated
# publishing, enable GitHub Actions for vobiz-ai/vobiz-flutter-sdk with the
# tag pattern v{{version}}. The tag must match the version in pubspec.yaml.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: flutter pub publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token that pub.dev accepts instead of a login
    steps:
      - uses: actions/checkout@v4

      # Sets up the pub.dev credentials from the OIDC token.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Check the tag matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi

      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force
