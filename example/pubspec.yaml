name: vobiz_webrtc_example
description: >-
  Vobiz Playground for Flutter: sign in with Zero-Config Setup, SIP Direct or
  an access token, then call with a caller ID, custom SIP headers, recording,
  Dial-User, transfer and conference, and receive calls with Vobiz push. The
  same options as the Vobiz WebRTC Playground on the web.
publish_to: 'none'
version: 2.0.0+1

environment:
  # What the dependencies below need (flutter_lints 6: Dart 3.8; firebase_core 4: Flutter 3.27).
  sdk: ^3.8.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  vobiz_webrtc:
    path: ../
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  http: ^1.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_callkit_incoming: ^3.1.6
  # Name-based UUIDs for CallKit's call ids (CallScreen.uuidFor).
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
