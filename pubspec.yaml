name: vobiz_webrtc
description: Flutter SDK for making and receiving calls on the Vobiz platform using SIP-over-WebSocket and WebRTC. Includes automatic SIP registration, WebRTC audio setup, and call state management.
version: 0.2.0

homepage: https://vobiz.ai
repository: https://github.com/vobiz-ai/vobiz-flutter-sdk
issue_tracker: https://github.com/vobiz-ai/vobiz-flutter-sdk/issues
documentation: https://github.com/vobiz-ai/vobiz-flutter-sdk#readme

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.0.0
  web_socket_channel: ^3.0.1
  crypto: ^3.0.3
  http: ^1.2.0
  meta: ^1.9.0
  # Network-change awareness (Wi-Fi <-> mobile, offline): issue #18.
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.0
