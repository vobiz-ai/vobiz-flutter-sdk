name: vobiz_webrtc
description: Make and receive Vobiz voice calls from Flutter on Android and iOS, with SIP over WebSocket for signalling and WebRTC for audio.
version: 0.3.0

homepage: https://vobiz.ai
repository: https://github.com/vobiz-ai/vobiz-flutter-sdk
issue_tracker: https://github.com/vobiz-ai/vobiz-flutter-sdk/issues

topics:
  - voip
  - webrtc
  - sip
  - calling
  - telephony

# Android and iOS only, as PLATFORM_SETUP.md says: no web (the SDK uses
# dart:io for its WebSocket) and no desktop.
platforms:
  android:
  ios:

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.0.0
  web_socket_channel: ^3.0.1
  crypto: ^3.0.3
  http: ^1.2.0
  meta: ^1.9.0
  # Network-change awareness (Wi-Fi <-> mobile, offline): issue #18.
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.0

# A plugin for its iOS code: PushKit, CallKit and WebRTC's audio around CallKit
# (ios/vobiz_webrtc, used by VobizIosPush). Android needs no native code.
flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: VobizWebrtcAndroid
      ios:
        pluginClass: VobizWebrtcPlugin
